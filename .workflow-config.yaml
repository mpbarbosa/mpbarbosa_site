      description: "Linting, prompt optimization, UX, versioning, and git — ALWAYS RUNS LAST"
      steps: ["13", "14", "15", "16", "22", "17", "0f", "12"]

# Conditional Step Execution Configuration
conditionals:
  step7_test_execution:
    skip_if:
      - no_code_changes: true
      - only_docs_changed: true
    run_if:
      - "src/**/*.js": changed
      - "src/__tests__/**/*.test.js": changed
    description: "Skip tests if only documentation or non-code files changed"

  step4_directory_structure:
    skip_if:
      - no_new_files: true
    cache_duration: 24h
    description: "Cache directory structure scan for 24 hours if no new files"

  step3_syntax_validation:
    skip_if:
      - no_js_changes: true
    run_if:
      - "src/**/*.js": changed
      - "**/*.mjs": changed
    description: "Skip syntax validation if no JavaScript files changed"

  step5_coverage_report:
    skip_if:
      - only_docs_changed: true
      - only_tests_changed: true
    run_if:
      - "src/**/*.js": changed
    description: "Skip coverage generation for docs-only or test-only changes"

# Change Detection Patterns
change_patterns:
  code_files:
    - "src/**/*.js"
    - "src/**/*.mjs"
    - "src/**/*.css"
    - "src/**/*.html"
    - "shell_scripts/**/*.sh"
  test_files:
    - "src/__tests__/**/*.js"
    - "src/__tests__/**/*.mjs"
  documentation_files:
    - "**/*.md"
    - "docs/**/*"
  config_files:
    - "src/package.json"
    - ".github/**/*.yml"
    - ".workflow-config.yaml"

# Change-Type Detection Configuration (Conventional Commits)
change_detection:
  enabled: true
  convention: "conventional_commits"

  types:
    feat:
      description: "New features"
      impact: "high"
      test_strategy: "all"
    fix:
      description: "Bug fixes"
      impact: "medium"
      test_strategy: "related"
    docs:
      description: "Documentation only"
      impact: "low"
      test_strategy: "none"
    refactor:
      description: "Code refactoring"
      impact: "medium"
      test_strategy: "comprehensive"
    test:
      description: "Test changes only"
      impact: "low"
      test_strategy: "tests_only"
    style:
      description: "Code style/formatting"
      impact: "low"
      test_strategy: "syntax_only"
    perf:
      description: "Performance improvements"
      impact: "medium"
      test_strategy: "all"
    chore:
      description: "Maintenance tasks"
      impact: "low"
      test_strategy: "minimal"
    ci:
      description: "CI/CD changes"
      impact: "low"
      test_strategy: "minimal"
    build:
      description: "Build system changes"
      impact: "low"
      test_strategy: "minimal"

  # Step routing based on change type
  routing:
    feat:
      steps: [security_audit, syntax_validation, directory_structure, test_execution, quality_checks, doc_validation, git_finalization]
    fix:
      steps: [security_audit, syntax_validation, test_execution, quality_checks, git_finalization]
    docs:
      steps: [syntax_validation, doc_validation, git_finalization]
    refactor:
      steps: [security_audit, syntax_validation, test_execution, quality_checks, git_finalization]
    test:
      steps: [syntax_validation, test_execution, git_finalization]
    style:
      steps: [syntax_validation, quality_checks, git_finalization]
    perf:
      steps: [security_audit, syntax_validation, test_execution, git_finalization]
    chore:
      steps: [security_audit, syntax_validation, git_finalization]
    ci:
      steps: [syntax_validation, git_finalization]
    build:
      steps: [security_audit, syntax_validation, test_execution, git_finalization]

  fallback:
    steps: [security_audit, syntax_validation, test_execution, git_finalization]
    description: "Default steps when type cannot be determined"

  pattern_detection:
    enabled: true
    patterns:
      - regex: "^(add|implement|create)\\s"
        type: "feat"
      - regex: "^(fix|repair|correct|resolve)\\s"
        type: "fix"
      - regex: "^(doc|document|readme)\\s"
        type: "docs"
      - regex: "^(refactor|restructure|reorganize)\\s"
        type: "refactor"
      - regex: "^(test|spec)\\s"
        type: "test"
      - regex: "^(style|format|lint)\\s"
        type: "style"
      - regex: "^(perf|optimize|speed)\\s"
        type: "perf"

version:
  config_files:
    - package.json
    - src/package.json

deploy:
  command: './shell_scripts/sync_to_staging.sh --both-steps'
  description: 'Deploy the main site and sibling project assets with the two-step staging workflow'
