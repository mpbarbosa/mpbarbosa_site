project:
  name: "mpbarbosa_site"
  type: "static-site"
  description: "MP Barbosa personal portfolio website — HTML5 UP Dimension template with sibling project integration"
  kind: "client_spa"
  version: "1.1.7"

tech_stack:
  primary_language: "javascript"
  secondary_languages:
    - "html"
    - "css"
    - "bash"
  build_system: "npm"
  test_framework: "jest"
  test_command: "npm test"
  lint_command: "npm run lint"
