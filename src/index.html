<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP Barbosa - Personal Website</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="grid-container">
        <header class="header">
            <h1>mpbarbosa.com (mpb)</h1>
            <nav>
                <a href="#about">About</a>
                <a href="#projects">Projects</a>
                <a href="#contact">Contact</a>
            </nav>
        </header>
        <section id="about" class="about">
            <h2>About Me</h2>
        </section>
        <section id="projects" class="projects">
            <h2>Personal Projects</h2>
            <ul>
                <li><a href="pages/music_in_numbers.html">Music in Numbers</a> - A web app that generates music based on numerical input.</li>
                <li><a href="pages/guia_turistico.html">Guia Turístico</a> - A travel guide application.</li>
            </ul>

        <aside class="curriculum">
            <h2>Curriculum</h2>

            <h2>Contact</h2>
            <form id="contact-form">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" placeholder="Your Message" required></textarea>
                <button type="submit">Send</button>
            </form>

        </footer>
    </div>
    <script src="scripts/main.js"></script>
