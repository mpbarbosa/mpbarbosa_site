# mpbarbosa-project-redirects.conf
# --------------------------------
# The legacy /pages/*.html stubs are meta-refresh bounces into the sibling
# project directories. Search engines treat a meta refresh as a weak, ambiguous
# redirect and may keep the stub URL in the index instead of the destination.
#
# These 301s make the same hops explicit at the HTTP layer, so link equity flows
# to the real project pages. The HTML stubs stay on disk as a no-JS/no-nginx
# fallback and now carry <meta name="robots" content="noindex, follow">, so
# whichever path a crawler takes, the stub itself never competes for the index.
#
# Paste inside the existing `server { ... }` block that serves www.mpbarbosa.com,
# above the generic `location /` block, then: nginx -t && systemctl reload nginx

location = /pages/guia-turistico.html {
    return 301 /guia_js/index.html;
}

location = /pages/monitora-vagas.html {
    return 301 /monitora_vagas/public/index.html;
}

location = /pages/music-in-numbers.html {
    return 301 /music_in_numbers/src/index.html;
}

# The archived v1 template keeps its own copies of the same stubs.
location = /v1/pages/guia-turistico.html {
    return 301 /guia_js/index.html;
}

location = /v1/pages/monitora-vagas.html {
    return 301 /monitora_vagas/public/index.html;
}

location = /v1/pages/music-in-numbers.html {
    return 301 /music_in_numbers/src/index.html;
}
