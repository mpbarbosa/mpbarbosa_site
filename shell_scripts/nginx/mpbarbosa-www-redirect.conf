# mpbarbosa-www-redirect.conf
# ---------------------------
# mpbarbosa.com (bare apex) is the canonical host. This vhost 301-redirects
# https://www.mpbarbosa.com -> https://mpbarbosa.com, preserving path and query
# ($request_uri).
#
# Why this direction: every canonical, hreflang, og:url and schema.org URL the
# site emits points at the bare apex. Serving both hosts with 200 (the state
# before this file is installed) is duplicate content; redirecting the apex to
# www instead would point every canonical at a URL that redirects, which is
# worse than the duplication.
#
# The AdSense "ads.txt — Não encontrado" that motivated the earlier apex->www
# experiment is already resolved: the apex resolves, serves the site, and serves
# /ads.txt directly. No redirect is needed for AdSense.
#
# Install / refresh with: shell_scripts/setup_www_redirect.sh
#
# PREREQUISITE THAT IS NOT IN THIS FILE: the main vhost that serves the site
# most likely still lists both names, e.g.
#     server_name mpbarbosa.com www.mpbarbosa.com;
# Two server blocks matching "www.mpbarbosa.com" exactly is ambiguous — nginx
# resolves it by config load order, not by intent. Drop www from the main block
# so it reads `server_name mpbarbosa.com;` before reloading, otherwise this
# redirect may never be reached. The setup script checks for this.
#
# The certificate already covers both names (CN=www.mpbarbosa.com with
# SAN: DNS:mpbarbosa.com, DNS:www.mpbarbosa.com), so no certbot work is needed.
# If you ever expand a differently named lineage, update both paths below to
# match /etc/letsencrypt/live/<cert-name>/.

# HTTP: send www straight to canonical HTTPS apex.
server {
    listen 80;
    listen [::]:80;
    server_name www.mpbarbosa.com;
    return 301 https://mpbarbosa.com$request_uri;
}

# HTTPS: terminate TLS with the shared certificate, then redirect to the apex.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mpbarbosa.com;

    ssl_certificate     /etc/letsencrypt/live/www.mpbarbosa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.mpbarbosa.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mpbarbosa.com$request_uri;
}
