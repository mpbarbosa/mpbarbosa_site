name: Accessibility Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  accessibility-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [25.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: src/package-lock.json
        
    - name: Install dependencies
      working-directory: ./src
      run: npm ci --legacy-peer-deps
      
    - name: Start development server
      working-directory: ./src
      run: |
        npm start &
        npx wait-on http://127.0.0.1:8080 -t 30000
        
    - name: Run accessibility tests (Jest + axe-core)
      working-directory: ./src
      run: npm run test:a11y
      
    - name: Run pa11y tests
      working-directory: ./src
      run: npm run test:pa11y
      continue-on-error: true
      
    - name: Upload accessibility report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: accessibility-report
        path: |
          src/coverage/
          src/eslint-report.json
        retention-days: 30
        
    - name: Comment PR with results
      if: github.event_name == 'pull_request' && failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '⚠️ Accessibility tests failed. Please review the [test results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) and fix the issues.'
          })
